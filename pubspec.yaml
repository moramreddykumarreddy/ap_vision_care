name: ap_vision_care
description: Andhra Pradesh Digital Vision Care & Public Health Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI & Charts
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  expandable: ^5.0.1

  # Icons & Assets
  cupertino_icons: ^1.0.6
  material_symbols_icons: ^4.2719.1

  # Data & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

  # Image handling
  cached_network_image: ^3.3.1

  # QR
  qr_flutter: ^4.1.0

  # Storage (local, no backend)
  shared_preferences: ^2.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/apvision.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/dummy/
